version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: fact_sales
    columns:
      - name: order_item_id
        tests:
          - not_null

snapshots:
  - name: snap_dim_customers
    columns:
      - name: customer_id
        tests:
          - not_null